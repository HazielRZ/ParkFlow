services:
  db:
    image: postgres:16-alpine
    container_name: parkflow-db
    restart: always
    environment:
      POSTGRES_DB: parkflow
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkflow_password}
    volumes:
      - parkflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkflow -d parkflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"   # Solo desarrollo: quitar este mapeo en un despliegue real.
    networks:
      - db-net

  api-backend:
    build:
      context: ./api-backend
      dockerfile: Dockerfile
    container_name: parkflow-api-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PARKFLOW_INFERENCE_SCHEMA_PATH=/contracts/json-schema/inference-state.schema.json
      # RNF-02: sobreescribir en despliegue real, nunca usar el valor dummy en producción.
      - PARKFLOW_JWT_SECRET_KEY=parkflow-itm-dummy-secret-key-CAMBIAR-EN-PRODUCCION
      - PARKFLOW_JWT_ALGORITHM=HS256
      - PARKFLOW_JWT_EXPIRE_MINUTES=60
      - PARKFLOW_DATABASE_URL=postgresql+psycopg://parkflow:${POSTGRES_PASSWORD:-parkflow_password}@db:5432/parkflow
    volumes:
      - ./contracts:/contracts:ro
    networks:
      - cv-ingestion-net
      - client-realtime-net
      - db-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost', 8000), 2); s.close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    container_name: parkflow-cv-service
    depends_on:
      api-backend:
        condition: service_healthy
    environment:
      - PARKFLOW_BACKEND_URL=http://api-backend:8000
      - PARKFLOW_INFERENCE_SCHEMA_PATH=/contracts/json-schema/inference-state.schema.json
    volumes:
      - ./contracts:/contracts:ro
    networks:
      - cv-ingestion-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f python || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: parkflow-client-app
    depends_on:
      api-backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_WS_URL=ws://localhost:8000/ws/parking-states
    networks:
      - client-realtime-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  parkflow-pgdata:

networks:
  cv-ingestion-net:
    driver: bridge
    internal: true
  client-realtime-net:
    driver: bridge
  db-net:
    driver: bridge
