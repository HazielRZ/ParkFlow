services:
  db:
    image: postgres:16-alpine
    container_name: parkflow-db
    environment:
      POSTGRES_DB: parkflow
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - parkflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkflow -d parkflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"   # Solo desarrollo: quitar este mapeo en un despliegue real.
    networks:
      - db-net
    restart: unless-stopped

  api-backend:
    build:
      context: ./api-backend
      dockerfile: Dockerfile
    container_name: parkflow-api-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PARKFLOW_INFERENCE_SCHEMA_PATH=/contracts/json-schema/inference-state.schema.json
      - PARKFLOW_JWT_SECRET_KEY=parkflow-itm-dummy-secret-key-CAMBIAR-EN-PRODUCCION
      - PARKFLOW_JWT_ALGORITHM=HS256
      - PARKFLOW_JWT_EXPIRE_MINUTES=60
      - PARKFLOW_DATABASE_URL=postgresql+psycopg://parkflow:${POSTGRES_PASSWORD}@db:5432/parkflow
    volumes:
      - ./contracts:/contracts:ro
    networks:
      - cv-ingestion-net
      - client-realtime-net
      - db-net
    restart: unless-stopped

  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    container_name: parkflow-cv-service
    depends_on:
      - api-backend
    environment:
      - PARKFLOW_BACKEND_URL=http://api-backend:8000
      - PARKFLOW_INFERENCE_SCHEMA_PATH=/contracts/json-schema/inference-state.schema.json
    volumes:
      - ./contracts:/contracts:ro
    networks:
      - cv-ingestion-net
    restart: unless-stopped

  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: parkflow-client-app
    depends_on:
      - api-backend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_WS_URL=ws://localhost:8000/ws/parking-states
    networks:
      - client-realtime-net
    restart: unless-stopped

volumes:
  parkflow-pgdata:

networks:
  cv-ingestion-net:
    driver: bridge
    internal: true
  client-realtime-net:
    driver: bridge
  db-net:
    driver: bridge